name: CI

# Cubre las 3 apps del monorepo (api, web, game). apps/game se sumó recién
# a este pipeline: hasta ahora vivía fuera del repo Git principal (su
# propio .git local, sin remoto, excluido vía .gitignore) y por eso no
# podía tener CI — eso ya se resolvió, así que ya no hay motivo para
# dejarla afuera de esta verificación.
on:
  pull_request:
  push:
    branches: [main]

env:
  PNPM_VERSION: "10.30.2"
  # Versión de Node para instalar/compilar/testear el PROYECTO (coincide
  # con engines.node en los package.json y con lo que se usará en Heroku).
  # No confundir con los avisos de GitHub sobre Node 20→24: esos son sobre
  # el runtime interno que usan las Actions de terceros (actions/checkout,
  # pnpm/action-setup, actions/setup-node) para ejecutar su propio código,
  # algo que deciden esas Actions, no esta variable ni nuestro código.
  NODE_VERSION: "20"

jobs:
  api:
    name: API (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: codebuddies
          POSTGRES_PASSWORD: codebuddies
          POSTGRES_DB: codebuddies_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://codebuddies:codebuddies@localhost:5432/codebuddies_db
      JWT_SECRET: ci-only-secret-not-for-production
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter api exec prisma generate

      - name: Prisma migrate deploy
        run: pnpm --filter api exec prisma migrate deploy

      # No bloqueante todavía: hay ~1800 hallazgos de lint preexistentes en
      # todo apps/api (sobre todo formateo) que no vienen de este pipeline.
      # Se deja visible en el log del job para no perder la señal, pero no
      # tumba el build hasta que se pague esa deuda a propósito.
      - name: Lint (informational)
        run: pnpm --filter api run lint:ci
        continue-on-error: true

      - name: Typecheck
        run: pnpm --filter api run typecheck

      # Excluye los specs de modules/game: son ejercicios de scaffolding sin
      # terminar de un área fuera del alcance de este pipeline (ver nota de
      # scope arriba), no algo que este CI deba bloquear.
      - name: Test
        run: pnpm --filter api exec jest --testPathIgnorePatterns="/node_modules/|modules/game/"

      - name: Build
        run: pnpm --filter api run build

  # SEC10: no había ningún escaneo de dependencias. Informational por
  # ahora (continue-on-error) — recién arranca a correr, así que primero
  # hay que ver qué hallazgos preexistentes trae antes de que bloquee PRs.
  audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      # Sin `cache: pnpm` a propósito: este job nunca corre `pnpm install`
      # (pnpm audit lee directo del lockfile), así que no hay nada que
      # cachear todavía en este punto -- con cache habilitado, setup-node
      # intentaba guardar el store de pnpm antes de que existiera y
      # tiraba "Path Validation Error: ... hence no cache is being saved"
      # en cada corrida. No afectaba el resultado del job, pero era ruido
      # de una config nuestra mal puesta, no una falla real de Actions.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: pnpm audit (high+ severity)
        run: pnpm audit --audit-level=high
        continue-on-error: true

  web:
    name: Web (lint / typecheck / build)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No bloqueante: mismo motivo que en el job de api (deuda de lint
      # preexistente, no introducida por este pipeline).
      - name: Lint (informational)
        run: pnpm --filter web run lint
        continue-on-error: true

      - name: Typecheck
        run: pnpm --filter web run typecheck

      - name: Build
        run: pnpm --filter web run build

  game:
    name: Game (lint / typecheck / build)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No bloqueante: mismo motivo que en los jobs de api/web (deuda de
      # lint preexistente en esta app, no introducida por este pipeline).
      - name: Lint (informational)
        run: pnpm --filter game run lint
        continue-on-error: true

      - name: Typecheck
        run: pnpm --filter game run typecheck

      - name: Build
        run: pnpm --filter game run build
