version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: codebuddies_postgres
    restart: always
    environment:
      POSTGRES_USER: codebuddies
      POSTGRES_PASSWORD: codebuddies
      POSTGRES_DB: codebuddies_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # HI12/PERF4: cache de aplicación para catálogo/rankings/dashboard admin.
  redis:
    image: redis:7-alpine
    container_name: codebuddies_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
